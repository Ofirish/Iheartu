<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#13030e">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Shared Heartbeat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&display=swap">
<style>
/* Layout: one full-bleed canvas (heart, galaxy, ripples), a caption and invite
   button at the bottom. Single dark look on purpose: the glow needs a night ground. */
:root {
  color-scheme: dark;
  --bg: #13030e;
  --rose: #ff4fa3;
  --blush: #ffd0e8;
  --deep: #7a1d4d;
  --ink: #ffe3f1;
  --font-display: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  --font-ui: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
html, body { margin: 0; height: 100%; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--ink);
  padding-inline: 16px;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
#heart { position: fixed; inset: 0; display: block; touch-action: none; cursor: pointer; }

.toast {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 96px);
  left: 0;
  right: 0;
  padding-inline: 24px;
  text-align: center;
  text-wrap: balance;
  pointer-events: none;
  font-family: var(--font-display);
  font-style: italic;
  font-weight: 500;
  font-size: 1.6rem;
  line-height: 1.2;
  color: #ffe9f7;
  text-shadow: 0 0 12px rgba(255, 79, 163, 0.95), 0 0 28px rgba(160, 90, 255, 0.8);
  opacity: 0;
  transition: opacity 0.6s ease;
}
.toast.show { opacity: 1; }

.caption {
  position: fixed;
  left: 0;
  right: 0;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
  padding-inline: 16px;
  text-align: center;
  pointer-events: none;
  font-family: var(--font-display);
  font-style: italic;
  font-weight: 500;
}
.caption p { margin: 0; }
.hint { font-size: 1.5rem; color: var(--blush); letter-spacing: 0.02em; text-shadow: 0 0 18px rgba(255, 79, 163, 0.7); }
.status { margin-top: 6px; min-height: 1.4em; font-size: 1.05rem; color: var(--blush); opacity: 0.75; display: flex; align-items: center; justify-content: center; gap: 8px; }
.status:empty { visibility: hidden; }
.status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--deep); flex: none; }
.status.together::before { background: var(--rose); box-shadow: 0 0 10px 2px var(--rose); }
.note { margin-top: 2px; font-size: 0.95rem; color: var(--blush); opacity: 0.6; }
.note:empty { display: none; }
.invite {
  pointer-events: auto;
  margin-top: 14px;
  min-height: 44px;
  padding: 8px 22px;
  border: 1px solid rgba(255, 208, 234, 0.4);
  border-radius: 999px;
  background: rgba(19, 3, 14, 0.5);
  color: var(--blush);
  font: inherit;
  font-size: 1.05rem;
  cursor: pointer;
  touch-action: manipulation;
}
.invite:hover { border-color: var(--rose); }
.invite:focus-visible { outline: 2px solid var(--rose); outline-offset: 3px; }
.invite[hidden] { display: none; }

.love {
  position: fixed;
  left: 50%;
  top: 42%;
  transform: translate(-50%, -50%);
  width: max-content;
  max-width: 94vw;
  margin: 0;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  font-family: var(--font-display);
  font-style: italic;
  font-weight: 500;
  line-height: 1;
  white-space: nowrap;
  background: linear-gradient(100deg, #ffb3e6 0%, #e2bbff 35%, #b890ff 65%, #ffb3e6 100%);
  background-size: 200% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
  filter: drop-shadow(0 1px 2px rgba(60, 5, 70, 0.75)) drop-shadow(0 0 10px rgba(255, 79, 163, 0.95)) drop-shadow(0 0 26px rgba(160, 90, 255, 0.9));
  animation: loveShimmer 3s linear infinite;
}
@keyframes loveShimmer { from { background-position: 0% 0; } to { background-position: 200% 0; } }
@media (prefers-reduced-motion: reduce) { .love { animation: none; } }

/* Secret admin: hot corner, passphrase box, panel */
.hot { position: fixed; top: 0; left: 0; width: 64px; height: calc(64px + env(safe-area-inset-top, 0px)); z-index: 30; background: transparent; touch-action: manipulation; }
.refresh { position: fixed; right: 0; bottom: 0; width: 64px; height: calc(64px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: transparent; touch-action: manipulation; }
.gate { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 10px); left: 10px; z-index: 31; }
.gate[hidden] { display: none; }
.gate input {
  width: 132px;
  padding: 8px 10px;
  font: 16px var(--font-ui);
  color: var(--ink);
  background: rgba(19, 3, 14, 0.88);
  border: 1px solid rgba(255, 208, 234, 0.3);
  border-radius: 8px;
  -webkit-user-select: text;
  user-select: text;
}
.gate input:focus-visible { outline: 2px solid var(--rose); }
.admin {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  height: 38vh;
  overflow-y: auto;
  box-sizing: border-box;
  padding: 12px 16px calc(env(safe-area-inset-bottom, 0px) + 12px);
  background: rgba(12, 3, 16, 0.94);
  border-top: 1px solid rgba(255, 208, 234, 0.25);
  color: var(--ink);
  font: 13px/1.4 var(--font-ui);
  z-index: 40;
  touch-action: pan-y;
}
.admin[hidden] { display: none; }
body.admin-open .caption { bottom: calc(38vh + 12px); }
.ad-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
.ad-head strong { font-weight: 600; letter-spacing: 0.02em; }
.ad-row { display: grid; gap: 4px; margin-bottom: 8px; }
.ad-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.65; }
.ad-opts { display: flex; flex-wrap: wrap; gap: 6px; }
.admin button {
  min-height: 34px;
  padding: 4px 12px;
  border: 1px solid rgba(255, 208, 234, 0.3);
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.04);
  color: var(--ink);
  font: inherit;
  cursor: pointer;
  touch-action: manipulation;
}
.admin button.on { background: rgba(255, 79, 163, 0.28); border-color: var(--rose); }
.admin button:focus-visible { outline: 2px solid var(--rose); outline-offset: 2px; }
</style>
</head>
<body>

<canvas id="heart" role="img" aria-label="A glittering pink heart that pulses. Touch it to send glowing ripples to the person you shared the link with."></canvas>
<div class="toast" id="toast" role="status"></div>
<div class="love" id="love" role="status"></div>
<div class="caption" aria-live="polite">
  <p class="hint">Touch the heart</p>
  <p class="status" id="status"></p>
  <p class="note" id="note"></p>
  <button class="invite" id="invite" type="button">Invite someone</button>
</div>
<div class="hot" id="hot"></div>
<div class="refresh" id="refresh"></div>
<div class="gate" id="gate" hidden><input id="gateInput" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Passphrase"></div>
<div class="admin" id="admin" hidden></div>

<script>
(function () {
  var cv = document.getElementById('heart');
  var ctx = cv.getContext('2d');
  var statusEl = document.getElementById('status');
  var noteEl = document.getElementById('note');
  var toastEl = document.getElementById('toast');
  var inviteBtn = document.getElementById('invite');
  var loveEl = document.getElementById('love');
  var hotEl = document.getElementById('hot');
  var refreshEl = document.getElementById('refresh');
  var gateEl = document.getElementById('gate');
  var gateInput = document.getElementById('gateInput');
  var adminEl = document.getElementById('admin');

  var reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  var AMP = reduce ? 0.03 : 0.065;
  var DUR = reduce ? 1.6 : 2.4;
  var MINE = '255,79,163';
  var THEIRS = '255,208,234';
  var PURPLE = '178,110,255';
  var IDLE_MS = 60000;      // untouched this long: the heart rests
  var NIGHT_START = 22;     // night hours, in each person's own local time: 22:00 to 07:00
  var NIGHT_END = 7;

  var W = 0, H = 0, dpr = 1, cx = 0, cy = 0, S = 1;
  var adminOpen = false;

  // <helpers> pure functions, also exercised by a test outside the page
  function okZone(z) {
    if (typeof z !== 'string' || !z || z.length > 64) return false;
    try { new Intl.DateTimeFormat('en-US', { timeZone: z }); return true; } catch (e) { return false; }
  }
  function hourIn(zone, d) {
    if (!zone) return d.getHours();
    return parseInt(new Intl.DateTimeFormat('en-US', { timeZone: zone, hour: 'numeric', hourCycle: 'h23' }).format(d), 10) % 24;
  }
  function nightFor(zone, d) {
    var h = hourIn(zone, d);
    return h >= NIGHT_START || h < NIGHT_END;
  }
  // </helpers>

  var myZone = '';
  try { myZone = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) {}
  if (!okZone(myZone)) myZone = '';

  // Heart outline in its own units: x -16..16, y -14.5..14.5, y pointing down, centred on 0,0.
  var hp = new Path2D();
  for (var i = 0; i <= 180; i++) {
    var t = i / 180 * Math.PI * 2;
    var hx = 16 * Math.pow(Math.sin(t), 3);
    var hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) - 2.5;
    if (i === 0) hp.moveTo(hx, hy); else hp.lineTo(hx, hy);
  }
  hp.closePath();

  // Glitter: random points that fall inside the heart.
  var tc = document.createElement('canvas').getContext('2d');
  var glitter = [];
  var tries = 0;
  while (glitter.length < 420 && tries < 30000) {
    tries++;
    var gx = Math.random() * 32 - 16;
    var gy = Math.random() * 29 - 14.5;
    if (tc.isPointInPath(hp, gx, gy)) {
      glitter.push({
        x: gx, y: gy,
        r: 0.1 + Math.random() * Math.random() * 0.5,
        ph: Math.random() * 6.283,
        sp: 0.8 + Math.random() * 3.2,
        w: Math.random() < 0.45
      });
    }
  }

  var bodyGrad = ctx.createRadialGradient(-5, -6, 1, 0, 0, 20);
  bodyGrad.addColorStop(0, '#ffa6d6');
  bodyGrad.addColorStop(0.45, '#ff4fa3');
  bodyGrad.addColorStop(1, '#b3125f');
  var glossGrad = ctx.createRadialGradient(-7, -7.5, 0, -7, -7.5, 8);
  glossGrad.addColorStop(0, 'rgba(255,255,255,0.38)');
  glossGrad.addColorStop(1, 'rgba(255,255,255,0)');

  var ripples = [];
  var sparks = [];
  var kisses = [];
  var kissUntil = 0;   // background kisses run until this time (seconds)
  var kissNext = 0;
  var boost = 0;
  var last = 0;
  var phase = 0;
  var dull = 0;          // 0 = lively, 1 = resting
  var nightAmt = 0;      // 0 = day, 1 = night
  var nightNow = { me: false, them: false };
  var nightChecked = -99;
  var nightSig = '';

  // shared state
  var lastTouchAt = 0;   // ms, last time either of you touched the heart
  var pending = 0;       // touches from the other person while you were away
  var lastSeenAt = 0;
  var partnerZone = '';
  var settled = false;
  var connected = false;
  var peers = {};
  var PEER_TTL = 50000;

  // "I love you" state
  var LOVE_TOTAL = 5.6;
  var GRACE = 1500;
  var loveStart = -100;
  var loveNextRipple = 0;
  var loveText = false;
  var mineDown = false;
  var mineUpAt = 0;
  var remote = {};

  // admin overrides, local to this phone
  var ovr = { heart: 'auto', time: 'auto', partner: 'auto', zone: 'auto', tickled: 'auto' };

  // ---- Galaxy (night) ----
  var galaxy = null, galaxyW = 0, galaxyH = 0, twinkles = [];
  function rng(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t2 = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t2 = t2 + Math.imul(t2 ^ t2 >>> 7, 61 | t2) ^ t2;
      return ((t2 ^ t2 >>> 14) >>> 0) / 4294967296;
    };
  }
  function buildGalaxy() {
    if (galaxy && galaxyW === W && galaxyH === H) return;
    galaxyW = W; galaxyH = H;
    var r = rng(20261012);
    function gauss() { return r() + r() + r() + r() - 2; }
    var gc = document.createElement('canvas');
    gc.width = Math.round(W * dpr);
    gc.height = Math.round(H * dpr);
    var g = gc.getContext('2d');
    g.scale(dpr, dpr);
    var bg = g.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#04020d');
    bg.addColorStop(0.5, '#0a0420');
    bg.addColorStop(1, '#14041c');
    g.fillStyle = bg;
    g.fillRect(0, 0, W, H);

    // Milky Way band running from lower left to upper right
    var ang = -0.55, ca = Math.cos(ang), sa = Math.sin(ang);
    var L = Math.hypot(W, H), m = Math.min(W, H), bw = m * 0.42;
    var bx = W / 2, by = H * 0.5;
    function bandPt(spread) {
      var u = (r() - 0.5) * L * 1.1, v = gauss() * spread;
      return [bx + u * ca - v * sa, by + u * sa + v * ca];
    }
    var cols = ['107,47,168', '194,65,142', '42,111,176', '88,60,190'];
    g.globalCompositeOperation = 'lighter';
    var n, p, rad, col, gr, size, a;
    for (n = 0; n < 18; n++) {
      p = bandPt(bw * 0.5);
      rad = (0.18 + r() * 0.3) * m * 1.2;
      col = cols[Math.floor(r() * cols.length)];
      gr = g.createRadialGradient(p[0], p[1], 0, p[0], p[1], rad);
      gr.addColorStop(0, 'rgba(' + col + ',0.20)');
      gr.addColorStop(1, 'rgba(' + col + ',0)');
      g.fillStyle = gr;
      g.fillRect(p[0] - rad, p[1] - rad, rad * 2, rad * 2);
    }
    for (n = 0; n < 2600; n++) {
      p = bandPt(bw * 0.55);
      a = 0.05 + r() * 0.25;
      size = 0.4 + r() * 0.9;
      g.fillStyle = 'rgba(215,200,255,' + a + ')';
      g.fillRect(p[0], p[1], size, size);
    }
    g.globalCompositeOperation = 'source-over';
    for (n = 0; n < 7; n++) {
      p = bandPt(bw * 0.35);
      rad = (0.06 + r() * 0.12) * m;
      gr = g.createRadialGradient(p[0], p[1], 0, p[0], p[1], rad);
      gr.addColorStop(0, 'rgba(4,2,12,0.35)');
      gr.addColorStop(1, 'rgba(4,2,12,0)');
      g.fillStyle = gr;
      g.fillRect(p[0] - rad, p[1] - rad, rad * 2, rad * 2);
    }
    var count = Math.round(W * H / 2500);
    for (n = 0; n < count; n++) {
      a = 0.2 + r() * 0.6;
      size = r() < 0.08 ? 1.6 : 0.9;
      g.fillStyle = 'rgba(255,255,255,' + a + ')';
      g.fillRect(r() * W, r() * H, size, size);
    }
    galaxy = gc;

    twinkles = [];
    for (n = 0; n < 70; n++) {
      var q = r();
      twinkles.push({ x: r() * W, y: r() * H, r: 0.8 + r() * 1.4, ph: r() * 6.283, sp: 0.6 + r() * 1.8, c: q < 0.3 ? '255,200,230' : (q < 0.6 ? '200,215,255' : '255,255,255') });
    }
  }
  function drawGalaxy(now) {
    if (nightAmt < 0.01 || !galaxy) return;
    ctx.save();
    ctx.globalAlpha = nightAmt;
    ctx.drawImage(galaxy, 0, 0, W, H);
    for (var i = 0; i < twinkles.length; i++) {
      var s = twinkles[i];
      var tw = 0.5 + 0.5 * Math.sin(now * s.sp + s.ph);
      ctx.fillStyle = 'rgba(' + s.c + ',' + (0.25 + 0.75 * tw) + ')';
      ctx.fillRect(s.x - s.r / 2, s.y - s.r / 2, s.r, s.r);
      if (s.r > 1.7 && tw > 0.7) {
        ctx.fillRect(s.x - s.r * 2.2, s.y - 0.3, s.r * 4.4, 0.6);
        ctx.fillRect(s.x - 0.3, s.y - s.r * 2.2, 0.6, s.r * 4.4);
      }
    }
    ctx.restore();
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    cv.style.width = W + 'px';
    cv.style.height = H + 'px';
    var vh = adminOpen ? H * 0.62 : H;
    S = Math.min(W * 0.64 / 32, vh * 0.40 / 29);
    cx = W / 2;
    cy = vh * 0.42;
    loveEl.style.top = cy + 'px';
    loveEl.style.fontSize = Math.max(28, S * 5.2) + 'px';
    buildGalaxy();
  }
  window.addEventListener('resize', resize);
  resize();

  function beatAt(p) {
    function g(c, w) { return Math.exp(-Math.pow((p - c) / w, 2)); }
    return Math.min(1, g(0.08, 0.06) + 0.65 * g(0.30, 0.07));
  }

  function burst(px, py, c) {
    for (var i = 0; i < 14; i++) {
      var ang = Math.random() * 6.283;
      var sp = 40 + Math.random() * 130;
      sparks.push({ x: px, y: py, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, life: 0, max: 0.6 + Math.random() * 0.6, r: 1 + Math.random() * 2.2, c: c });
    }
    if (sparks.length > 220) sparks.splice(0, sparks.length - 220);
  }

  // ---- Kisses: a double tap sends a few up from the heart; the secret sequence fills the background for 10 s ----
  var KISS_BG_SECONDS = 10;
  function addKiss(x, y, big) {
    var now = performance.now() / 1000;
    var a = -Math.PI / 2 + (Math.random() - 0.5) * 1.4;
    var sp = big ? 0 : 50 + Math.random() * 90;
    kisses.push({
      x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (big ? 12 + Math.random() * 14 : 0),
      rot: (Math.random() - 0.5) * 0.9, vr: (Math.random() - 0.5) * 0.6,
      size: big ? 22 + Math.random() * 40 : 26 + Math.random() * 22,
      t0: now, max: big ? 2.4 + Math.random() * 1.4 : 1.6 + Math.random() * 0.8
    });
    if (kisses.length > 170) kisses.shift();
  }
  function kissBurst(u, v) {
    var px = cx + u * S, py = cy + v * S;
    for (var i = 0; i < 7; i++) addKiss(px + (Math.random() - 0.5) * 20, py, false);
    boost = Math.min(boost + 0.06, 0.16);
  }
  function startKissRain(nowS) {
    kissUntil = nowS + KISS_BG_SECONDS;
    kissNext = 1;
    boost = 0.16;
    showToast('Kisses \uD83D\uDC8B');
  }
  function drawKisses(now, dt) {
    if (now < kissUntil) {
      kissNext += dt * 16;
      while (kissNext >= 1) { kissNext -= 1; addKiss(Math.random() * W, Math.random() * H, true); }
    }
    if (!kisses.length) return;
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    var fade = kissUntil > now ? 1 : Math.max(0, 1 - (now - kissUntil) / 0.2);
    for (var i = kisses.length - 1; i >= 0; i--) {
      var kq = kisses[i];
      var age = now - kq.t0;
      if (age >= kq.max) { kisses.splice(i, 1); continue; }
      kq.x += kq.vx * dt; kq.y += kq.vy * dt; kq.rot += kq.vr * dt;
      var f = age / kq.max;
      var al = Math.min(1, f / 0.15) * (1 - Math.pow(f, 2.2));
      var pop = 0.6 + 0.4 * Math.min(1, age / 0.25);
      ctx.save();
      ctx.globalAlpha = Math.max(0, al) * 0.9;
      ctx.translate(kq.x, kq.y);
      ctx.rotate(kq.rot);
      ctx.font = Math.round(kq.size * pop) + 'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
      ctx.fillText('\uD83D\uDC8B', 0, 0);
      ctx.restore();
    }
    ctx.restore();
  }

  function addTouch(u, v, mine) {
    var now = performance.now() / 1000;
    ripples.push({ t0: now, c: mine ? MINE : THEIRS });
    if (ripples.length > 12) ripples.shift();
    boost = Math.min(boost + 0.09, 0.16);
    burst(cx + u * S, cy + v * S, mine ? MINE : THEIRS);
    // no buzzing a sleeping phone
    if (mine || !nightNow.me) {
      try { if (navigator.vibrate) navigator.vibrate(mine ? 25 : 70); } catch (e) {}
    }
  }

  // ---- effective states (real, unless the admin panel overrides them) ----
  function remoteHeld(nowMs) {
    for (var id in remote) {
      var p = remote[id];
      if (p.holdAt && nowMs - p.holdAt < 10000) return true;
    }
    return false;
  }
  function effPartnerZone() {
    if (ovr.zone === 'same') return myZone;
    if (ovr.zone !== 'auto') return ovr.zone;
    return partnerZone;
  }
  function effLastTouch() {
    var t = ovr.tickled;
    if (t === 'none') return 0;
    if (t === '2m') return Date.now() - 120000;
    if (t === 'yday') return Date.now() - 26 * 3600000;
    if (t === '3d') return Date.now() - 72 * 3600000;
    return lastTouchAt;
  }
  function effIdle() {
    if (ovr.heart === 'active') return false;
    if (ovr.heart === 'dull') return true;
    var lt = effLastTouch();
    if (!lt) return false;   // nobody has touched it yet: a brand new heart stays lively

    try {

        tasks.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
          return Promise.all(rs.map(function (r) { return r.unregister(); }));
        }));
      }
    } catch (e) {}
    try {
      if (window.caches && caches.keys) {
        tasks.push(caches.keys().then(function (ks) {
          return Promise.all(ks.map(function (k) { return caches.delete(k); }));
        }));
      }
    } catch (e) {}
    Promise.all(tasks).then(go, go);
    setTimeout(go, 2500);   // never get stuck
  }
  refreshEl.addEventListener('click', hardRefresh);

  // ---- Secret admin: tap the top-left corner, type Ofir, and the panel opens ----
  // This only changes what this phone shows. It is not real security; anyone reading the page source can find it.
  var gateTimer = 0;
  function closeGate() { gateEl.hidden = true; gateInput.value = ''; clearTimeout(gateTimer); }
  hotEl.addEventListener('click', function () {
    if (!gateEl.hidden) { closeGate(); return; }
    gateEl.hidden = false;
    gateInput.value = '';
    try { gateInput.focus(); } catch (e) {}
    clearTimeout(gateTimer);
    gateTimer = setTimeout(closeGate, 12000);
  });
  gateInput.addEventListener('input', function () {
    if (gateInput.value === 'Ofir') { closeGate(); openAdmin(); }
  });
  gateInput.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeGate(); });

  var GROUPS = [
    { key: 'heart', label: 'Heart', opts: [['auto', 'Auto'], ['active', 'Lively'], ['dull', 'Resting (dull)']] },
    { key: 'time', label: 'Time of day', opts: [['auto', 'Auto'], ['day', 'Day'], ['night-me', 'Night: you'], ['night-them', 'Night: them'], ['night-both', 'Night: both']] },
    { key: 'partner', label: 'Other person', opts: [['auto', 'Auto'], ['waiting', 'Waiting'], ['here', 'Here'], ['reconnecting', 'Reconnecting']] },
    { key: 'zone', label: 'Their time zone', opts: [['auto', 'Auto'], ['same', 'Same as you'], ['Asia/Tokyo', 'Tokyo'], ['America/New_York', 'New York'], ['Australia/Sydney', 'Sydney']] },
    { key: 'tickled', label: 'Last touch (for resting)', opts: [['auto', 'Auto'], ['none', 'Never'], ['2m', '2 min ago'], ['yday', 'Yesterday'], ['3d', '3 days ago']] }
  ];
  var ACTIONS = [['love', 'Play “I love you”'], ['away1', 'Away message ×1'], ['away9', 'Away message ×9'], ['ripple', 'Ripple'], ['kiss', 'Kiss rain'], ['buzz', 'Buzz test'], ['reset', 'Reset all']];

  function refreshAdmin() {
    var bs = adminEl.querySelectorAll('button[data-group]');
    for (var i = 0; i < bs.length; i++) bs[i].classList.toggle('on', ovr[bs[i].dataset.group] === bs[i].dataset.val);
  }
  function afterOvr() {
    nightNow = nightInfo();
    nightChecked = performance.now() / 1000;
    nightSig = nightNow.me + ',' + nightNow.them;
    refreshAdmin();
    updateStatus();
  }
  function runAction(a) {
    if (a === 'love') startLove(performance.now() / 1000);
    else if (a === 'away1') showAway(1);
    else if (a === 'away9') showAway(9);
    else if (a === 'ripple') addTouch(0, 0, true);
    else if (a === 'kiss') startKissRain(performance.now() / 1000);
    else if (a === 'buzz') {
      if (!navigator.vibrate) showToast("This browser can't vibrate");
      else showToast(navigator.vibrate(250) ? 'Buzz sent' : 'Buzz blocked: tap the page first');
    }
    else if (a === 'reset') {
      ovr = { heart: 'auto', time: 'auto', partner: 'auto', zone: 'auto', tickled: 'auto' };
      afterOvr();
    }
  }
  function mk(tag, cls, txt) {
    var el = document.createElement(tag);
    if (cls) el.className = cls;
    if (txt) el.textContent = txt;
    return el;
  }
  function buildAdmin() {
    adminEl.textContent = '';
    var head = mk('div', 'ad-head');
    head.appendChild(mk('strong', '', 'Admin · emulate states'));
    var close = mk('button', '', 'Close');
    close.type = 'button';
    close.addEventListener('click', closeAdmin);
    head.appendChild(close);
    adminEl.appendChild(head);
    GROUPS.forEach(function (g) {
      var row = mk('div', 'ad-row');
      row.appendChild(mk('span', 'ad-label', g.label));
      var box = mk('div', 'ad-opts');
      g.opts.forEach(function (o) {
        var b = mk('button', '', o[1]);
        b.type = 'button';
        b.dataset.group = g.key;
        b.dataset.val = o[0];
        b.addEventListener('click', function () { ovr[g.key] = o[0]; afterOvr(); });
        box.appendChild(b);
      });
      row.appendChild(box);
      adminEl.appendChild(row);
    });
    var arow = mk('div', 'ad-row');
    arow.appendChild(mk('span', 'ad-label', 'Actions'));
    var abox = mk('div', 'ad-opts');
    ACTIONS.forEach(function (a) {
      var b = mk('button', '', a[1]);
      b.type = 'button';
      b.addEventListener('click', function () { runAction(a[0]); });
      abox.appendChild(b);
    });
    arow.appendChild(abox);
    adminEl.appendChild(arow);
    refreshAdmin();
  }
  function openAdmin() {
    buildAdmin();
    adminOpen = true;
    adminEl.hidden = false;
    document.body.classList.add('admin-open');
    resize();
  }
  function closeAdmin() {
    adminOpen = false;
    adminEl.hidden = true;
    document.body.classList.remove('admin-open');
    resize();
  }
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && adminOpen) closeAdmin(); });
})();
</script>
</body>
</html>
